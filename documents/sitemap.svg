    <text x="188" y="203" text-anchor="middle">SERVICES</text>
    <text x="188" y="221" text-anchor="middle" fill="#0a1628" font-family="Arial">services.html</text>

    <rect x="264" y="180" width="104" height="56" rx="6" fill="#ffffff" stroke="#16304d" stroke-width="1.5"/>
    <text x="316" y="203" text-anchor="middle">PRICING</text>
    <text x="316" y="221" text-anchor="middle" fill="#0a1628" font-family="Arial">pricing.html</text>

    <rect x="392" y="180" width="104" height="56" rx="6" fill="#ffffff" stroke="#16304d" stroke-width="1.5"/>
    <text x="444" y="203" text-anchor="middle">BOOKING</text>
    <text x="444" y="221" text-anchor="middle" fill="#0a1628" font-family="Arial">booking.html</text>

    <rect x="504" y="180" width="104" height="56" rx="6" fill="#ffffff" stroke="#16304d" stroke-width="1.5"/>
    <text x="556" y="203" text-anchor="middle" font-size="9.5">TESTIMONIALS</text>
    <text x="556" y="221" text-anchor="middle" fill="#0a1628" font-family="Arial">testimonials.html</text>

    <rect x="632" y="180" width="104" height="56" rx="6" fill="#ffffff" stroke="#16304d" stroke-width="1.5"/>
    <text x="684" y="203" text-anchor="middle">FAQ</text>
    <text x="684" y="221" text-anchor="middle" fill="#0a1628" font-family="Arial">faq.html</text>

    <rect x="760" y="180" width="104" height="56" rx="6" fill="#ffffff" stroke="#16304d" stroke-width="1.5"/>
    <text x="812" y="203" text-anchor="middle">CONTACT</text>
