  <text x="500" y="300" text-anchor="middle" fill="#334155" font-size="13">All 8 pages are linked from the primary navigation menu and footer on every page,</text>
  <text x="500" y="320" text-anchor="middle" fill="#334155" font-size="13">so a visitor can reach any page from any other page in a single click.</text>
  <text x="500" y="350" text-anchor="middle" fill="#334155" font-size="12">Home → About → Services → Pricing → Booking → Testimonials → FAQ → Contact</text>

  <text x="500" y="440" text-anchor="middle" fill="#8ea0b8" font-size="11">TechFix IT Solutions — Site Structure — WEDE5020 Part 1</text>
</svg>
