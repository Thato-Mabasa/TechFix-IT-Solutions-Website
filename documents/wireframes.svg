<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <style>
    .frame { fill: #ffffff; stroke: #16304d; stroke-width: 2; }
    .block { fill: #eef2f6; stroke: #8ea0b8; stroke-width: 1.5; }
    .accent { fill: #cdeee8; stroke: #2dd4bf; stroke-width: 1.5; }
    .label { fill: #16304d; font-size: 13px; font-weight: bold; }
    .sublabel { fill: #5b6b80; font-size: 11px; }
    .title { fill: #0a1628; font-size: 18px; font-weight: bold; }
  </style>

  <!-- Title -->
  <text x="20" y="30" class="title">TechFix IT Solutions — Low-Fidelity Wireframes (3 page templates)</text>

  <!-- ============ Template 1: Homepage-style hero page ============ -->
  <text x="20" y="60" class="label">1. Homepage template (index.html)</text>
  <rect x="20" y="70" width="360" height="560" class="frame"/>
  <rect x="30" y="80" width="340" height="40" class="block"/>
  <text x="45" y="105" class="sublabel">Logo | Nav links | Menu toggle</text>

  <rect x="30" y="130" width="185" height="150" class="accent"/>
  <text x="40" y="150" class="sublabel">Hero heading</text>
  <text x="40" y="165" class="sublabel">+ intro text</text>
  <text x="40" y="180" class="sublabel">+ 2 CTA buttons</text>
  <rect x="225" y="130" width="145" height="150" class="block"/>
  <text x="235" y="210" class="sublabel">Hero image</text>

  <rect x="30" y="295" width="340" height="60" class="block"/>
  <text x="45" y="320" class="sublabel">Stats strip (4 columns)</text>

  <rect x="30" y="370" width="105" height="90" class="block"/>
  <rect x="145" y="370" width="105" height="90" class="block"/>
  <rect x="260" y="370" width="110" height="90" class="block"/>
  <text x="40" y="480" class="sublabel">3-column services grid</text>

  <rect x="30" y="490" width="340" height="70" class="accent"/>
  <text x="45" y="530" class="sublabel">CTA banner</text>

  <rect x="30" y="575" width="340" height="45" class="block"/>
  <text x="45" y="600" class="sublabel">Footer (3 cols + bottom bar)</text>

  <!-- ============ Template 2: Inner content page ============ -->
  <text x="420" y="60" class="label">2. Inner page template (about / services / pricing / testimonials / faq)</text>
  <rect x="420" y="70" width="360" height="560" class="frame"/>
  <rect x="430" y="80" width="340" height="40" class="block"/>
  <text x="445" y="105" class="sublabel">Logo | Nav links | Menu toggle</text>

  <rect x="430" y="130" width="340" height="80" class="accent"/>
  <text x="445" y="175" class="sublabel">Page hero (title + short intro)</text>

  <rect x="430" y="225" width="340" height="90" class="block"/>
  <text x="445" y="270" class="sublabel">Section: heading + lede text</text>

  <rect x="430" y="325" width="105" height="90" class="block"/>
  <rect x="545" y="325" width="105" height="90" class="block"/>
  <rect x="660" y="325" width="110" height="90" class="block"/>
  <text x="445" y="435" class="sublabel">Repeating card / grid section</text>
  <text x="445" y="450" class="sublabel">(cards, team members, pricing tiers, FAQ items)</text>

  <rect x="430" y="470" width="340" height="90" class="block"/>
  <text x="445" y="515" class="sublabel">Secondary content section</text>

  <rect x="430" y="575" width="340" height="45" class="block"/>
  <text x="445" y="600" class="sublabel">Footer (3 cols + bottom bar)</text>

  <!-- ============ Template 3: Form page ============ -->
  <text x="820" y="60" class="label">3. Form page template (booking / contact)</text>
  <rect x="820" y="70" width="360" height="560" class="frame"/>
  <rect x="830" y="80" width="340" height="40" class="block"/>
  <text x="845" y="105" class="sublabel">Logo | Nav links | Menu toggle</text>

  <rect x="830" y="130" width="340" height="70" class="accent"/>
  <text x="845" y="170" class="sublabel">Page hero (title + short intro)</text>

  <rect x="830" y="215" width="340" height="330" class="block"/>
  <text x="845" y="240" class="sublabel">Form card:</text>
  <rect x="845" y="255" width="310" height="22" class="frame"/>
  <rect x="845" y="285" width="310" height="22" class="frame"/>
  <rect x="845" y="315" width="310" height="22" class="frame"/>
  <rect x="845" y="345" width="150" height="22" class="frame"/>
  <rect x="1005" y="345" width="150" height="22" class="frame"/>
  <rect x="845" y="375" width="310" height="60" class="frame"/>
  <text x="855" y="410" class="sublabel">Textarea</text>
  <rect x="845" y="450" width="130" height="34" class="accent"/>
  <text x="860" y="472" class="sublabel">Submit</text>
  <text x="845" y="500" class="sublabel">Client-side validation via js/script.js</text>
  <text x="845" y="516" class="sublabel">(required fields, email format)</text>

  <rect x="830" y="560" width="340" height="60" class="block"/>
  <text x="845" y="595" class="sublabel">Contact page only: map embed + locations grid</text>

  <text x="20" y="650" class="sublabel">Note: wireframes represent shared structural patterns across the 8-page site rather than</text>
  <text x="20" y="666" class="sublabel">a separate wireframe per page, since header, footer, and section patterns repeat throughout.</text>
</svg>
